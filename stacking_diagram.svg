<text x="590" y="530" font-size="13" fill="#333">• The wing only fits one way: its 16-pin row goes</text>
<text x="590" y="551" font-size="13" fill="#333">  on the Feather's 16-pin row (this side) and its</text>
<text x="590" y="572" font-size="13" fill="#333">  12-pin row on the 12-pin row (far side).</text>
<text x="590" y="593" font-size="13" fill="#333">• Power (3V, GND) and the sensor's I2C signals</text>
<text x="590" y="614" font-size="13" fill="#333">  (SDA, SCL) pass through the headers, so no</text>
<text x="590" y="635" font-size="13" fill="#333">  wires go between the sensor and the Feather.</text>
<text x="590" y="656" font-size="13" fill="#333">• Jumper wires to the screen plug into the</text>
<text x="590" y="677" font-size="13" fill="#333">  breadboard row next to the pin they need.</text>
