<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="940" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
    <pattern id="holes" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect x="6" y="6" width="5" height="5" fill="#9a9a9a"/>
    </pattern>
  </defs>

  <text x="230" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">1. Exploded side view</text>
  <text x="760" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">2. Stacked</text>

  <!-- ================= EXPLODED ================= -->
  <!-- FeatherWing -->
  <rect x="170" y="70" width="60" height="30" rx="3" fill="#cfcfcf" stroke="#888" stroke-width="2"/>
  <rect x="80" y="100" width="300" height="12" fill="#1a1a1a"/>
  <rect x="82" y="112" width="22" height="10" fill="#222"/>
  <rect x="356" y="112" width="22" height="10" fill="#222"/>
  <g stroke="#c9a227" stroke-width="4"><line x1="93" y1="122" x2="93" y2="150"/><line x1="367" y1="122" x2="367" y2="150"/></g>

  <text x="400" y="88" font-size="14" fill="#222">AMG8833 sensor (faces up)</text>
  <line x1="398" y1="84" x2="235" y2="84" stroke="#888" stroke-width="1.5"/>
  <text x="400" y="110" font-size="14" font-weight="bold" fill="#222">AMG8833 FeatherWing</text>
  <text x="400" y="140" font-size="14" fill="#222">male header pins point down</text>
  <line x1="398" y1="136" x2="372" y2="136" stroke="#888" stroke-width="1.5"/>

  <line x1="230" y1="160" x2="230" y2="192" stroke="#444" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Feather with stacking headers -->
  <rect x="80" y="205" width="28" height="40" fill="#111"/>
  <rect x="352" y="205" width="28" height="40" fill="#111"/>
  <rect x="88" y="207" width="12" height="4" fill="#555"/>
  <rect x="360" y="207" width="12" height="4" fill="#555"/>
  <rect x="180" y="229" width="90" height="16" rx="2" fill="#b8b8b8" stroke="#888"/>
  <rect x="50" y="232" width="34" height="13" rx="2" fill="#d9d9d9" stroke="#888"/>
  <rect x="80" y="245" width="300" height="12" fill="#1a1a1a"/>
  <g stroke="#c9a227" stroke-width="4"><line x1="94" y1="257" x2="94" y2="300"/><line x1="366" y1="257" x2="366" y2="300"/></g>

  <text x="400" y="212" font-size="14" fill="#222">stacking headers: sockets on top...</text>
  <line x1="398" y1="208" x2="384" y2="208" stroke="#888" stroke-width="1.5"/>
  <text x="400" y="256" font-size="14" font-weight="bold" fill="#222">Feather M0 WiFi</text>
  <text x="400" y="296" font-size="14" fill="#222">...long pins out the bottom</text>
  <line x1="398" y1="292" x2="372" y2="292" stroke="#888" stroke-width="1.5"/>
  <text x="225" y="226" font-size="11" fill="#444" text-anchor="middle">WiFi module</text>
  <text x="38" y="226" font-size="11" fill="#444">USB</text>

  <line x1="230" y1="310" x2="230" y2="342" stroke="#444" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Breadboard -->
  <rect x="50" y="355" width="360" height="40" rx="4" fill="#ececec" stroke="#bdbdbd" stroke-width="2"/>
  <rect x="50" y="355" width="360" height="40" fill="url(#holes)" opacity="0.7"/>
  <text x="430" y="380" font-size="14" font-weight="bold" fill="#222">Breadboard</text>

  <!-- ================= STACKED ================= -->
  <rect x="610" y="355" width="300" height="40" rx="4" fill="#ececec" stroke="#bdbdbd" stroke-width="2"/>
  <rect x="610" y="355" width="300" height="40" fill="url(#holes)" opacity="0.7"/>
  <!-- feather pins into breadboard -->
  <g stroke="#c9a227" stroke-width="4"><line x1="644" y1="333" x2="644" y2="360"/><line x1="876" y1="333" x2="876" y2="360"/></g>
  <!-- feather pcb -->
  <rect x="610" y="296" width="30" height="12" rx="2" fill="#d9d9d9" stroke="#888"/>
  <rect x="630" y="321" width="260" height="12" fill="#1a1a1a"/>
  <rect x="715" y="305" width="80" height="16" rx="2" fill="#b8b8b8" stroke="#888"/>
  <!-- sockets -->
  <rect x="630" y="281" width="28" height="40" fill="#111"/>
  <rect x="862" y="281" width="28" height="40" fill="#111"/>
  <!-- wing -->
  <rect x="632" y="271" width="22" height="10" fill="#222"/>
  <rect x="864" y="271" width="22" height="10" fill="#222"/>
  <rect x="630" y="259" width="260" height="12" fill="#1a1a1a"/>
  <rect x="730" y="229" width="60" height="30" rx="3" fill="#cfcfcf" stroke="#888" stroke-width="2"/>

  <!-- jumper wire into breadboard row -->
  <path d="M890 362 C 905 330, 915 300, 925 270" fill="none" stroke="#9467bd" stroke-width="5" stroke-linecap="round"/>
  <rect x="885" y="352" width="10" height="14" fill="#333"/>

  <text x="760" y="220" font-size="13" fill="#222" text-anchor="middle">AMG8833 FeatherWing</text>
  <text x="760" y="350" font-size="13" fill="#222" text-anchor="middle">Feather M0 WiFi</text>

  <!-- notes -->
  <g font-size="14" fill="#333">
    <text x="610" y="430">• The 16-pin row goes over the 16-pin row</text>
    <text x="610" y="452">  and the 12-pin row over the 12-pin row,</text>
    <text x="610" y="474">  so the wing only fits one way round.</text>
    <text x="610" y="500">• Jumper wires to the screen plug into the</text>
    <text x="610" y="522">  breadboard row of the Feather pin you need.</text>
  </g>
  <g font-size="14" fill="#333">
    <text x="50" y="440">The wing gets power (3V, GND) and the I2C signals</text>
    <text x="50" y="462">(SDA, SCL) through the headers, so no wires are</text>
    <text x="50" y="484">needed between the sensor and the Feather.</text>
  </g>
</svg>
